name: Unit tests
on:
  push:
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 22

    - name: Install dependencies
      uses: bahmutov/npm-install@v1

    - name: Run tests
      run: npm run test
